<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Osservatorio Meteo RACE · POST</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#dfe9f1;font-family:Segoe UI,Arial,sans-serif;color:#0b2e6b;padding:18px}
.frame{position:relative;width:min(100%,640px);background:#fff;border:14px solid #0b2e6b;padding:10px;box-shadow:0 10px 40px #0b2e6b33}
.inner{position:relative;border:1.5px solid #b79a5a;padding:32px 28px 20px;text-align:center;background:linear-gradient(#fff,#f3f8fc)}
.cs{position:absolute;width:30px;height:30px;background:#fff;padding:2px}.cs.a{top:-17px;left:-17px}.cs.b{top:-17px;right:-17px}.cs.c{bottom:-17px;left:-17px}.cs.d{bottom:-17px;right:-17px}
.logo{width:116px;height:116px;border:1px solid #d6e0ea;border-radius:6px}
h1{margin:12px 0 2px;font-size:28px;letter-spacing:.04em;display:flex;align-items:center;justify-content:center;gap:12px}h1 svg{width:42px;height:42px;flex:none}h1 svg.flip{transform:scaleX(-1)}
.by{font-size:13px;color:#4b6a8c;letter-spacing:.12em;text-transform:uppercase}
.rule{height:1.5px;background:linear-gradient(90deg,transparent,#b79a5a,transparent);margin:20px 0}
select{width:100%;padding:13px 12px;font:inherit;font-size:17px;font-weight:700;color:#0b2e6b;background:#fff;border:1.5px solid #0b2e6b;border-radius:10px}
.btn{display:block;width:100%;margin-top:12px;padding:14px;background:#0b2e6b;color:#fff;border:0;border-radius:10px;font:inherit;font-size:16px;font-weight:700;cursor:pointer;text-align:center}.btn:hover{background:#164a9a}input[type=file]{display:none}
.race{margin-top:22px;border:1.5px solid #0b2e6b;border-radius:10px;padding:22px 12px 24px;background:#fff;position:relative;min-height:150px}.race:before{content:"";position:absolute;inset:4px;border:1px solid #b79a5a66;border-radius:7px;pointer-events:none}
.lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#7a8da3}.res{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}@media(max-width:520px){.res{grid-template-columns:1fr}}.k{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#4b6a8c}.win{margin-top:4px;font-size:32px;font-weight:800}.win:before{content:"🏆";display:block;font-size:26px;margin-bottom:2px}.dev{margin-top:4px;font-size:13px;color:#4b6a8c}.none{font-size:15px;color:#7a8da3;margin-top:22px}
.msg{margin-top:14px;font-size:16px;color:#4b6a8c}.msg.err{color:#a33a2a;font-size:14px}.asof{margin-top:10px;font-size:12px;color:#7a8da3}
.wave{margin:20px auto 6px;display:block;width:60%;max-width:280px}.foot{font-size:11px;color:#6b7f95}

async function fetchText(u){const c=new AbortController(),timer=setTimeout(()=>c.abort(),25000);try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw Error('HTTP '+r.status);return await r.text()}finally{clearTimeout(timer)}}
async function fetchJSON(u){const s=await fetchText(u);let o;try{o=JSON.parse(s)}catch{throw Error('Risposta non JSON')};if(o.error)throw Error(o.reason||'Errore API');return o}
function hourlyObs(rows){
 const buckets=new Map();for(const r of rows){const h=Math.floor(r.time/3600000)*3600000;if(!buckets.has(h))buckets.set(h,[]);buckets.get(h).push(r)}
 const result=new Map();for(const [h,arr] of buckets){const speeds=arr.map(x=>x.speed).filter(Number.isFinite);if(!speeds.length)continue;const dirs=arr.filter(x=>Number.isFinite(x.dir));let dir=null;if(dirs.length){const sx=dirs.reduce((a,x)=>a+Math.cos(x.dir*Math.PI/180),0),sy=dirs.reduce((a,x)=>a+Math.sin(x.dir*Math.PI/180),0);dir=(Math.atan2(sy,sx)*180/Math.PI+360)%360}result.set(h,{time:h,speed:speeds.reduce((a,b)=>a+b,0)/speeds.length,dir,n:speeds.length})}return result;
}
function parseMeteoHubJSONL(text){
 const records=new Map(),lines=text.split(/\r?\n/);let parsed=0,windRecords=0;
 for(const line of lines){
  if(!line.trim())continue;
  let rec;try{rec=JSON.parse(line)}catch{continue}
  parsed++;
  const base=rec.data?.[0]?.vars||{},lat=Number(base.B05001?.v??rec.lat/100000),lon=Number(base.B06001?.v??rec.lon/100000);
  const name=String(base.B01019?.v||rec.ident||'Stazione senza nome'),network=String(base.B01194?.v||rec.network||'rete sconosciuta');
  const vars={};for(const block of (rec.data||[])){for(const [k,v] of Object.entries(block.vars||{})){if(k==='B11001'||k==='B11002')vars[k]=Number(v?.v)}}
  if(!Number.isFinite(vars.B11001)&&!Number.isFinite(vars.B11002))continue;
  windRecords++;
  const key=network+'|'+name+'|'+lat.toFixed(5)+'|'+lon.toFixed(5);
  if(!records.has(key))records.set(key,{key,name,network,lat,lon,rows:[]});
  const s=records.get(key);const time=Date.parse(rec.date||'');
  if(Number.isFinite(time))s.rows.push({time,speed:Number.isFinite(vars.B11002)?vars.B11002*1.943844:null,dir:Number.isFinite(vars.B11001)?((vars.B11001%360)+360)%360:null});
 }
 const list=[...records.values()].filter(s=>s.rows.length&&Number.isFinite(s.lat)&&Number.isFinite(s.lon)&&Math.abs(s.lat)<=90&&Math.abs(s.lon)<=180);
 // MeteoHub può pubblicare velocità e direzione in record distinti: ricongiungili per stazione e timestamp.
 for(const s of list){
  const merged=new Map();
  for(const r of s.rows){if(!merged.has(r.time))merged.set(r.time,{time:r.time,speed:null,dir:null});const m=merged.get(r.time);if(Number.isFinite(r.speed))m.speed=r.speed;if(Number.isFinite(r.dir))m.dir=r.dir}
  s.rows=[...merged.values()].filter(r=>Number.isFinite(r.speed)||Number.isFinite(r.dir));
 }
 return {list,parsed,windRecords};
}
async function fetchForecast(name,model,common,lead){const hourly=`wind_speed_10m_previous_day${lead},wind_direction_10m_previous_day${lead}`,cands=name==='AROME'?[model,'meteofrance_arome_france_hd']:[model],spK=`wind_speed_10m_previous_day${lead}`,drK=`wind_direction_10m_previous_day${lead}`;let lastErr='';for(const m of cands){try{const data=await fetchJSON(api('https://previous-runs-api.open-meteo.com/v1/forecast',{...common,models:m,hourly})),h=data.hourly||{};for(const k of [spK,drK]){if(!h[k]){const alt=Object.keys(h).find(x=>x.startsWith(k));if(alt)h[k]=h[alt]}}const sp=h[spK],ok=sp?sp.filter(Number.isFinite).length:0;if(ok)return {name,data,usedModel:m};lastErr=`${m}: `+(sp?`0 valori su ${sp.length} ore (fuori dominio o storico previous_day${lead} non disponibile)`:'serie assente nella risposta')+(name==='AROME'&&lead===2?'. AROME copre solo ~48 h: prova «24 ore»':'')}catch(e){lastErr=m+': '+e.message}}return {name,error:lastErr}}

$('#race').onchange=run;
async function compute(rid,id){
 const cand=[...STATIONS.values()].filter(s=>COASTSET.has(norm(s.name)));
 if(!cand.length)throw Error('Nel file non ci sono stazioni costiere o delle isole');
 const ids=[...new Set(ROUTES[rid].map(([la,lo])=>cand.reduce((b,s)=>{const d=hav(la,lo,s.lat,s.lon);return !b||d<b.d?{s,d}:b},null).s))];
 const acc=Object.fromEntries(MODELS.map(([n])=>[n,{n:0,sum:0,nd:0,dsum:0}]));let first=Infinity,last=0;
 for(let k=0;k<ids.length;k++){
  if(id!==runId)return null;show(`<div class="msg">Calcolo in corso… ${k+1}/${ids.length}</div>`);
  const s=ids[k],times=s.rows.map(r=>r.time),a=times.reduce((x,y)=>Math.min(x,y),Infinity),b=times.reduce((x,y)=>Math.max(x,y),0);first=Math.min(first,a);last=Math.max(last,b);
  const obs=hourlyObs(s.rows),common={latitude:s.lat,longitude:s.lon,start_date:iso(new Date(a)),end_date:iso(new Date(b)),timezone:'GMT',wind_speed_unit:'kn'};
  const fc=await Promise.all(MODELS.map(([n,m])=>fetchForecast(n,m,common,LEAD)));
  for(const r of fc){if(r.error)continue;const h=r.data.hourly,sp=h[`wind_speed_10m_previous_day${LEAD}`],dr=h[`wind_direction_10m_previous_day${LEAD}`],A=acc[r.name];(h.time||[]).forEach((t,i)=>{const o=obs.get(Date.parse(t+'Z'));if(!o||!Number.isFinite(sp[i]))return;A.n++;A.sum+=Math.abs(o.speed-sp[i]);if(o.speed>=MINWIND&&Number.isFinite(o.dir)&&Number.isFinite(dr?.[i])){A.nd++;A.dsum+=ang(o.dir,dr[i])}})}
 }
 const best=(cnt,val)=>{const r=MODELS.map(([n])=>({name:n,c:acc[n][cnt],v:acc[n][cnt]?acc[n][val]/acc[n][cnt]:null})).filter(x=>x.c>=12).sort((x,y)=>x.v-y.v);if(!r.length)return null;const t=r.filter(x=>Math.abs(x.v-r[0].v)<1e-6);return {name:t.map(x=>x.name).join(' / '),v:r[0].v}};
 return {wind:best('n','sum'),dir:best('nd','dsum'),start:new Date(first),end:new Date(last)};
}
const fd=d=>String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0')+'/'+d.getUTCFullYear(),dec=v=>v.toFixed(1).replace('.',',');
function render(r){
 if(!r.wind&&!r.dir){show('<div class="msg">Dati insufficienti</div>');return}
 const blk=(k,x,u)=>`<div><div class="k">${k}</div>`+(x?`<div class="win">${x.name}</div><div class="dev">scarto medio dal reale: ${dec(x.v)}${u==='°'?'°':' '+u}</div>`:'<div class="none">Dati insufficienti</div>')+'</div>';
 show(`<div class="res">${blk('Intensità del vento',r.wind,'nodi')}${blk('Direzione del vento',r.dir,'°')}</div><div class="asof">dati dal ${fd(r.start)} al ${fd(r.end)}</div>`);
}
async function run(){
 const rid=$('#race').value,id=++runId;
 if(!rid){show('<div class="msg">Seleziona la regata e importa il file</div>');return}
 if(!STATIONS.size){show('<div class="msg">Importa il file per vedere il risultato</div>');return}
 if(CACHE[rid]){render(CACHE[rid]);return}
 try{show('<div class="msg">Calcolo in corso…</div>');const r=await compute(rid,id);if(!r||id!==runId)return;CACHE[rid]=r;render(r)}
 catch(err){if(id===runId)show('<div class="msg err">'+(/HTTP|fetch|Failed|rete|network/i.test(err.message)?'Servizio previsioni non raggiungibile. Riprova.':err.message)+'</div>')}
}
</script></body></html>
